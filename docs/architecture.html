<body><main class="frame"><p class="eyebrow">Arquitetura · visão geral</p><h1>Como o Telerion conecta descoberta, mídia e Telegram</h1>

</svg><p class="note">O núcleo mantém a experiência do Telegram separada das integrações externas. O PlaybackService é o ponto único de coordenação da fila, do FFmpeg e da chamada.</p></main></body></html>
