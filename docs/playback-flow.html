<g><rect x="40" y="128" width="144" height="96" rx="12" fill="#fff" stroke="#8a98a2"/><text x="112" y="164" text-anchor="middle" font-size="14" font-weight="600">1. Buscar</text><text x="112" y="188" text-anchor="middle" font-family="Geist Mono" font-size="9" fill="#667784">texto no bot</text><text x="112" y="204" text-anchor="middle" font-family="Geist Mono" font-size="9" fill="#667784">/find ou menu</text></g>
<g><rect x="256" y="128" width="144" height="96" rx="12" fill="#fff" stroke="#4ba9d1"/><text x="328" y="164" text-anchor="middle" font-size="14" font-weight="600">2. Identificar</text><text x="328" y="188" text-anchor="middle" font-family="Geist Mono" font-size="9" fill="#667784">TMDB + ano</text><text x="328" y="204" text-anchor="middle" font-family="Geist Mono" font-size="9" fill="#667784">sinopse + elenco</text></g>

<line x1="40" y1="624" x2="1240" y2="624" stroke="#d9e0e4"/><text x="40" y="652" font-family="Geist Mono" font-size="8" fill="#667784" letter-spacing="2">LEITURA</text><text x="128" y="652" font-family="Geist Mono" font-size="9" fill="#667784">linha superior: descoberta e preparação · linha central: reprodução · linha inferior: encerramento</text>
</svg><p class="note">A fonte só chega ao FFmpeg depois que o título, a qualidade e o arquivo foram validados. <strong>Parar</strong> encerra a live e preserva o download; <strong>Sair</strong> encerra a live e solicita ao qBittorrent a remoção do torrent com seus arquivos.</p></main></body></html>
