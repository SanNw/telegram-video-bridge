name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar Python
        run: uv python install 3.13

      - name: Instalar dependências
        run: uv sync --all-groups

      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run black --check .

      - name: mypy
        run: uv run mypy

      - name: pytest
        run: uv run pytest

      - name: Auditar dependências
        run: uv run --with pip-audit pip-audit

      - name: Validar imagem Docker
        run: docker build -f docker/Dockerfile -t telerion:ci .

      - name: Validar Docker Compose
        env:
          API_ID: "1"
          API_HASH: test
          SESSION_STRING: test
          CHAT_ID: "-1001"
        run: |
          cp .env.example .env
          docker compose config --quiet
