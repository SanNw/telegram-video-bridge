name: "🐞 Bug · Erro · Error"
description: Report a reproducible Telerion problem
title: "[Bug] "
labels: [bug]
body:
  - type: dropdown
    id: language
    attributes:
      label: Language / Idioma
      options: [Português, English, Español]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0 or commit hash
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened? / O que aconteceu? / ¿Qué ocurrió?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps / Passos / Pasos
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove tokens, session strings, passwords, IDs and private media names.
      render: shell
