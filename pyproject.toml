[project]
name = "telegram-video-bridge"
version = "0.1.0"
description = "Transmite vídeos autorizados para chamadas de vídeo/grupo do Telegram via MTProto, operando inteiramente em background."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
dependencies = [
    # kurigram: fork ativamente mantido do Pyrogram (mesmo namespace de import
    # `pyrogram`, drop-in). O Pyrogram oficial está sem release desde abril/2023
    # e ficou incompatível com o py-tgcalls atual (falta pyrogram.errors.
    # GroupcallForbidden, usado internamente pelo adapter do py-tgcalls) —
    # confirmado em teste real de import, não é só uma preocupação teórica.
    "kurigram>=2.2.24",
    "tgcrypto>=1.2.5",
    # Sem o extra [pyrogram]: puxaria também o pacote PyPI oficial "pyrogram"
    # (obsoleto), que instala no mesmo caminho `pyrogram/` que o kurigram —
    # conflito de instalação. O py-tgcalls importa `pyrogram.*` de forma
    # preguiçosa (só quando o client passado é reconhecido como tal), então
    # o namespace fornecido pelo kurigram já é suficiente.
    "py-tgcalls>=2.3.3",
    "uvloop>=0.21.0; sys_platform != 'win32'",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "loguru>=0.7.2",
    "aiofiles>=24.1.0",
    "rich>=13.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rapidfuzz>=3.10",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "types-aiofiles>=24.1.0",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "C4", "SIM"]
# ASYNC240: projeto usa asyncio puro (não trio/anyio), a sugestão da regra não se aplica.
ignore = ["E501", "ASYNC240"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
files = ["app"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyrogram", "pyrogram.*", "pytgcalls", "pytgcalls.*", "ntgcalls", "ntgcalls.*"]
ignore_missing_imports = true
implicit_reexport = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=88"

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
