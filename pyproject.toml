[project]
name = "telegram-video-bridge"
version = "0.1.0"
description = "Transmite vídeos autorizados para chamadas de vídeo/grupo do Telegram via MTProto, operando inteiramente em background."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "pyrogram>=2.0.106",
    "tgcrypto>=1.2.5",
    "py-tgcalls[pyrogram]>=2.3.3",
    "uvloop>=0.21.0; sys_platform != 'win32'",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "loguru>=0.7.2",
    "aiofiles>=24.1.0",
    "rich>=13.9",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "black>=24.10.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "types-aiofiles>=24.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "C4", "SIM"]
# ASYNC240: projeto usa asyncio puro (não trio/anyio), a sugestão da regra não se aplica.
ignore = ["E501", "ASYNC240"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
files = ["app"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyrogram", "pyrogram.*", "pytgcalls", "pytgcalls.*", "ntgcalls", "ntgcalls.*"]
ignore_missing_imports = true
implicit_reexport = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=90"

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
