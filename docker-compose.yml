services:
  bridge:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: telegram-video-bridge
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - logs:/app/logs
      - ${QBITTORRENT_SAVE_PATH:-./media/torrents}:/app/media/torrents
      - data:/app/data

volumes:
  logs:
  data:
